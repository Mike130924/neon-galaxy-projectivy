name: Build Neon Galaxy APK V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Extract Android project V4
        run: |
          mkdir -p project
          unzip -q Neon_Galaxy_Cosmic_Glass_V4_Source.zip -d project

      - name: Build APK V4
        working-directory: project
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Save APK V4
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Galaxy-APK-v4
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
