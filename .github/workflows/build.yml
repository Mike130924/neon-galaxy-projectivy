
name: Build Neon Galaxy APK V5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Extract Android project V5
        run: |
          mkdir -p project
          unzip -q Neon_Galaxy_Cosmic_Glass_V5.zip -d project

      - name: Verify Android project
        run: |
          test -f project/gradlew
          test -f project/app/build.gradle || test -f project/app/build.gradle.kts
          echo "V5 source extracted successfully."

      - name: Build APK V5
        working-directory: project
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK V5
        run: |
          ls -lh project/app/build/outputs/apk/debug/*.apk
          test -n "$(find project/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Save APK V5
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Galaxy-APK-v5
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
