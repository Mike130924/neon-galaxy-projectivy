
name: Build Neon Galaxy APK V7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Extract Android project V7
        run: |
          mkdir -p project
          unzip -q Neon_Galaxy_Cosmic_Glass_V7.zip -d project

      - name: Verify Android project
        run: |
          test -f project/gradlew
          test -f project/app/build.gradle || test -f project/app/build.gradle.kts
          echo "V7 source extracted successfully."

      - name: Verify V7 icon mappings
        run: |
          APPFILTER="project/app/src/main/assets/appfilter.xml"

          grep -q 'com.syncler/' "$APPFILTER"
          grep -q 'com.syncler.beta/' "$APPFILTER"
          grep -q 'com.wuaki.apptv/' "$APPFILTER" || true
          grep -q 'com.vewd.core.browser/' "$APPFILTER"
          grep -q 'com.android.vending/' "$APPFILTER"
          grep -q 'com.google.android.youtube.tv/' "$APPFILTER" || true
          echo "V7 mapping checks completed."

      - name: Build APK V7
        working-directory: project
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK V7
        run: |
          APK=$(find project/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          ls -lh "$APK"

      - name: Save APK V7
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Galaxy-APK-v7
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
