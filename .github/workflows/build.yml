
name: Build Neon Galaxy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Extract Android project
        run: |
          mkdir -p project

          ZIP_FILES=$(find . -maxdepth 1 -type f -iname '*.zip')

          if [ -z "$ZIP_FILES" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          ZIP_COUNT=$(printf '%s\n' "$ZIP_FILES" | wc -l)

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "ERROR: More than one ZIP file found."
            echo "$ZIP_FILES"
            echo "Please leave only the correct project ZIP in the repository."
            exit 1
          fi

          ZIP_FILE=$(printf '%s\n' "$ZIP_FILES" | head -n 1)

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          if [ ! -f project/gradlew ]; then
            echo "ERROR: gradlew was not found in the extracted project."
            echo "The ZIP may contain an extra parent folder."
            find project -maxdepth 3 -type f -name gradlew
            exit 1
          fi

      - name: Build APK
        working-directory: project
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Galaxy-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
